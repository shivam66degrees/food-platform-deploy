apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-platform-secrets
  labels:
    app.kubernetes.io/name: food-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.global.jwtSecret | default "food-platform-dev-jwt-secret-min-32-chars" | quote }}
